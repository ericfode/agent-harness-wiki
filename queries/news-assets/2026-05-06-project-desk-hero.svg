<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Editorial illustration for the 2026-05-06 nightly source-projects desk</title>
  <desc id="desc">Symbolic newsroom table with ten survey lanes: specification reducers, testing environments, terminal work, game/interface projects, orchestration ledgers, private corpus gates, Gemma/tinygrad benches, and research side rooms.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172033"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="18%" r="60%">
      <stop offset="0" stop-color="#f8e7b2" stop-opacity="0.48"/>
      <stop offset="0.35" stop-color="#c59b57" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3347"/>
      <stop offset="1" stop-color="#121827"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      .stroke{stroke:#d8c48a;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .thin{stroke:#8fb9ff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.82}
      .cyan{stroke:#72e0d1;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .gold{stroke:#e6c36a;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .red{stroke:#ff8d82;fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .fill-panel{fill:#1d2537;stroke:#53617d;stroke-width:3}
      .paper{fill:#263249;stroke:#8fa0c2;stroke-width:3}
      .muted{opacity:.62}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#lamp)"/>
  <ellipse cx="800" cy="740" rx="660" ry="110" fill="#02040a" opacity=".48" filter="url(#soft)"/>

  <!-- back wall: quiet evidence grid -->
  <g opacity=".18">
    <path d="M160 180H1440M160 260H1440M160 340H1440" class="thin"/>
    <path d="M260 110V400M420 110V400M580 110V400M740 110V400M900 110V400M1060 110V400M1220 110V400M1380 110V400" class="thin"/>
    <circle cx="420" cy="260" r="10" fill="#72e0d1"/>
    <circle cx="900" cy="180" r="10" fill="#e6c36a"/>
    <circle cx="1220" cy="340" r="10" fill="#ff8d82"/>
  </g>

  <!-- table -->
  <path d="M155 620 C350 530 1240 530 1445 620 L1310 790 C1040 855 570 855 290 790 Z" fill="url(#table)" stroke="#48536b" stroke-width="4"/>
  <path d="M230 635 C445 585 1155 585 1375 635" class="thin" opacity=".45"/>

  <!-- Ten survey trays, unlabeled by design -->
  <g transform="translate(230 575)">
    <rect x="0" y="0" width="110" height="80" rx="14" class="fill-panel"/>
    <path d="M22 50 L45 28 L82 43 L57 62 Z" class="gold"/>
    <path d="M46 28 V13 M82 43 L98 31" class="cyan"/>
  </g>
  <g transform="translate(360 545)">
    <rect x="0" y="0" width="110" height="80" rx="14" class="fill-panel"/>
    <path d="M28 55 C38 25 70 22 82 48" class="cyan"/>
    <path d="M38 48 l12 12 l30 -34" class="gold"/>
  </g>
  <g transform="translate(490 525)">
    <rect x="0" y="0" width="110" height="80" rx="14" class="fill-panel"/>
    <rect x="22" y="23" width="66" height="38" rx="6" fill="#0f1522" stroke="#72e0d1" stroke-width="4"/>
    <path d="M34 37 h40 M34 48 h28" class="thin"/>
  </g>
  <g transform="translate(620 515)">
    <rect x="0" y="0" width="110" height="80" rx="14" class="fill-panel"/>
    <rect x="26" y="17" width="36" height="50" rx="5" fill="#2d2338" stroke="#e6c36a" stroke-width="4"/>
    <path d="M71 30 l20 12 l-20 12 l-20 -12 Z" class="cyan"/>
    <circle cx="44" cy="42" r="9" fill="#ff8d82" opacity=".8"/>
