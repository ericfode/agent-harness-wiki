    <path d="M38 58 C20 50 21 27 39 20 C57 13 78 24 77 45 C76 61 54 68 38 58 Z" fill="#202a40" stroke="#8fb9ff" stroke-width="4"/>
    <path d="M76 24 C94 30 100 47 90 62" class="red"/>
    <path d="M18 62 C40 42 69 42 95 22" class="gold"/>
  </g>
  <g transform="translate(880 515)">
    <rect x="0" y="0" width="110" height="80" rx="14" class="fill-panel"/>
    <path d="M24 20 h58 v42 h-58 Z" fill="#151c2d" stroke="#8fa0c2" stroke-width="3"/>
    <circle cx="36" cy="32" r="6" fill="#72e0d1"/>
