    <circle cx="54" cy="52" r="6" fill="#ff8d82"/>
    <path d="M42 32H64 M66 36L58 48 M50 49L40 36" class="thin"/>
  </g>
  <g transform="translate(1010 525)">
    <rect x="0" y="0" width="110" height="80" rx="14" class="fill-panel"/>
    <path d="M24 27 h44 a12 12 0 0 1 12 12 v22 h-56 Z" fill="#2a344a" stroke="#e6c36a" stroke-width="4"/>
    <path d="M76 38 h15 v23 h-15" class="red"/>
    <path d="M38 27 v-9 h28 v9" class="cyan"/>
  </g>
  <g transform="translate(1140 545)">
    <rect x="0" y="0" width="110" height="80" rx="14" class="fill-panel"/>
    <path d="M22 58 C32 35 45 25 57 25 C75 25 88 43 92 62" class="thin"/>
    <path d="M30 58 C52 44 70 44 90 58" class="cyan"/>
    <path d="M55 19 l8 14 l-16 0 Z" fill="#e6c36a" opacity=".9"/>
  </g>
  <g transform="translate(1270 575)">
    <rect x="0" y="0" width="110" height="80" rx="14" class="fill-panel"/>
    <path d="M30 58 C42 36 58 25 80 20" class="gold"/>
    <path d="M31 58 a18 13 0 1 0 34 0 a18 13 0 1 0 -34 0" class="red"/>
    <path d="M71 28 c20 8 24 28 12 42" class="cyan"/>
  </g>

  <!-- central evidence prism -->
  <g transform="translate(0 -10)">
    <path d="M695 300 L800 235 L905 300 L800 365 Z" fill="#1f2a40" stroke="#d8c48a" stroke-width="5"/>
    <path d="M800 235 V365" class="stroke" opacity=".55"/>
    <path d="M695 300 H905" class="stroke" opacity=".55"/>
    <path d="M575 285 C630 275 660 282 695 300" class="cyan"/>
    <path d="M905 300 C955 276 1008 276 1055 292" class="gold"/>
    <path d="M905 300 C955 333 1008 340 1060 325" class="red"/>
    <rect x="515" y="250" width="58" height="80" rx="8" class="paper"/>
    <rect x="1060" y="248" width="58" height="80" rx="8" class="paper"/>
    <rect x="1130" y="270" width="58" height="80" rx="8" class="paper" opacity=".85"/>
    <rect x="444" y="270" width="58" height="80" rx="8" class="paper" opacity=".85"/>
  </g>

  <!-- side privacy shield -->
  <g transform="translate(1230 205)">
    <path d="M70 0 L130 25 V82 C130 123 100 153 70 166 C40 153 10 123 10 82 V25 Z" fill="#172235" stroke="#8fb9ff" stroke-width="5"/>
    <path d="M45 83 l18 18 l38 -52" class="gold"/>
  </g>

  <!-- small dots: surveyed directories -->
  <g opacity=".75">
    <circle cx="265" cy="725" r="5" fill="#72e0d1"/>
    <circle cx="315" cy="742" r="5" fill="#e6c36a"/>
    <circle cx="365" cy="733" r="5" fill="#ff8d82"/>
    <circle cx="415" cy="748" r="5" fill="#72e0d1"/>
    <circle cx="465" cy="724" r="5" fill="#8fb9ff"/>
    <circle cx="515" cy="744" r="5" fill="#72e0d1"/>
    <circle cx="565" cy="730" r="5" fill="#e6c36a"/>
    <circle cx="615" cy="752" r="5" fill="#ff8d82"/>
    <circle cx="665" cy="730" r="5" fill="#8fb9ff"/>
    <circle cx="715" cy="744" r="5" fill="#72e0d1"/>
    <circle cx="765" cy="726" r="5" fill="#e6c36a"/>
    <circle cx="815" cy="752" r="5" fill="#ff8d82"/>
    <circle cx="865" cy="730" r="5" fill="#8fb9ff"/>
    <circle cx="915" cy="744" r="5" fill="#72e0d1"/>
    <circle cx="965" cy="726" r="5" fill="#e6c36a"/>
    <circle cx="1015" cy="752" r="5" fill="#ff8d82"/>
    <circle cx="1065" cy="730" r="5" fill="#8fb9ff"/>
    <circle cx="1115" cy="744" r="5" fill="#72e0d1"/>
    <circle cx="1165" cy="726" r="5" fill="#e6c36a"/>
    <circle cx="1215" cy="752" r="5" fill="#ff8d82"/>
    <circle cx="1265" cy="730" r="5" fill="#8fb9ff"/>
    <circle cx="1315" cy="744" r="5" fill="#72e0d1"/>
  </g>
</svg>
