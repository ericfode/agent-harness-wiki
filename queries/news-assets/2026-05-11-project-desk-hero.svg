<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Symbolic editorial illustration for the 2026-05-11 nightly source projects desk</title>
  <desc id="desc">Ten survey lanes converge on public-safe project clusters: testing gates, Basis blocks, Gemma tensor benches, typed latent buses, a roguelike grid, a kettlebell arc, a terminal pane, and safety shutters.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.55" stop-color="#172033"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0" stop-color="#eab308"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:22px; fill:#dbeafe; letter-spacing:.03em}
      .small{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:14px; fill:#94a3b8}
      .micro{font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; fill:#cbd5e1}
      .line{stroke:#64748b; stroke-width:2; opacity:.55}
      .lane{stroke:#60a5fa; stroke-width:3; opacity:.75}
      .panel{fill:#111827; stroke:#334155; stroke-width:2; rx:18}
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="600" cy="338" r="248" fill="none" stroke="#1e3a8a" stroke-width="2" opacity=".55"/>
  <circle cx="600" cy="338" r="178" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 12" opacity=".8"/>

  <!-- ten survey lanes -->
  <g filter="url(#glow)">
    <line class="lane" x1="600" y1="338" x2="600" y2="52"/>
    <line class="lane" x1="600" y1="338" x2="768" y2="107"/>
    <line class="lane" x1="600" y1="338" x2="939" y2="205"/>
    <line class="lane" x1="600" y1="338" x2="984" y2="398"/>
    <line class="lane" x1="600" y1="338" x2="829" y2="588"/>
    <line class="lane" x1="600" y1="338" x2="600" y2="632"/>
    <line class="lane" x1="600" y1="338" x2="371" y2="588"/>
    <line class="lane" x1="600" y1="338" x2="216" y2="398"/>
    <line class="lane" x1="600" y1="338" x2="261" y2="205"/>
    <line class="lane" x1="600" y1="338" x2="432" y2="107"/>
  </g>
  <circle cx="600" cy="338" r="74" fill="#0f172a" stroke="url(#gold)" stroke-width="5"/>
  <text x="600" y="329" text-anchor="middle" class="label">10 LANES</text>
  <text x="600" y="355" text-anchor="middle" class="small">39 dirs • evidence only</text>

  <!-- outer project glyphs -->
  <g class="panel">
    <rect x="526" y="32" width="148" height="66" rx="14" fill="#111827" stroke="#475569"/>
    <text x="600" y="58" text-anchor="middle" class="small">TEST GATES</text>
    <path d="M555 76 l14 14 l32 -38" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="616" y="68" width="34" height="18" rx="4" fill="#334155"/>
  </g>
  <g>
    <rect x="710" y="84" width="144" height="70" rx="14" fill="#111827" stroke="#475569"/>
    <text x="782" y="111" text-anchor="middle" class="small">BASIS</text>
    <rect x="737" y="124" width="28" height="18" rx="3" fill="#eab308"/>
    <rect x="774" y="124" width="28" height="18" rx="3" fill="#38bdf8"/>
    <rect x="811" y="124" width="28" height="18" rx="3" fill="#a78bfa"/>
  </g>
  <g>
    <rect x="888" y="174" width="162" height="76" rx="14" fill="#111827" stroke="#475569"/>
    <text x="969" y="201" text-anchor="middle" class="small">GEMMA BENCH</text>
    <g fill="none" stroke="#22d3ee" stroke-width="2">
      <path d="M925 220 h88 M925 232 h88 M925 244 h88"/>
      <path d="M938 211 v42 M960 211 v42 M982 211 v42 M1004 211 v42"/>
    </g>
  </g>
  <g>
    <rect x="936" y="368" width="154" height="72" rx="14" fill="#111827" stroke="#475569"/>
    <text x="1013" y="394" text-anchor="middle" class="small">NNPL BUS</text>
    <path d="M968 422 C992 390 1026 454 1054 414" fill="none" stroke="url(#violet)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="760" y="554" width="154" height="74" rx="14" fill="#111827" stroke="#475569"/>
    <text x="837" y="581" text-anchor="middle" class="small">ROGUE GRID</text>
    <g fill="#1f2937" stroke="#64748b">
      <rect x="797" y="594" width="18" height="18"/><rect x="819" y="594" width="18" height="18"/><rect x="841" y="594" width="18" height="18"/><rect x="863" y="594" width="18" height="18"/>
      <rect x="797" y="616" width="18" height="18"/><rect x="819" y="616" width="18" height="18"/><rect x="841" y="616" width="18" height="18"/><rect x="863" y="616" width="18" height="18"/>
    </g>
    <circle cx="850" cy="605" r="6" fill="#f97316"/>
  </g>
  <g>
    <rect x="526" y="596" width="148" height="58" rx="14" fill="#111827" stroke="#475569"/>
    <text x="600" y="620" text-anchor="middle" class="small">SAFETY</text>
    <path d="M552 636 h96" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 8"/>
  </g>
  <g>
    <rect x="286" y="554" width="170" height="74" rx="14" fill="#111827" stroke="#475569"/>
    <text x="371" y="581" text-anchor="middle" class="small">KETTLEBELL</text>
    <path d="M337 615 C348 585 394 585 405 615" fill="none" stroke="#f97316" stroke-width="6" stroke-linecap="round"/>
    <circle cx="371" cy="619" r="18" fill="none" stroke="#f97316" stroke-width="6"/>
  </g>
  <g>
    <rect x="112" y="368" width="178" height="72" rx="14" fill="#111827" stroke="#475569"/>
    <text x="201" y="394" text-anchor="middle" class="small">HANDTERM</text>
    <text x="150" y="423" class="micro">$ render --fast</text>
  </g>
  <g>
    <rect x="146" y="174" width="178" height="76" rx="14" fill="#111827" stroke="#475569"/>
    <text x="235" y="201" text-anchor="middle" class="small">CONTROL PLANE</text>
    <circle cx="201" cy="226" r="10" fill="#60a5fa"/><circle cx="235" cy="226" r="10" fill="#eab308"/><circle cx="269" cy="226" r="10" fill="#a78bfa"/>
    <path d="M211 226 h14 M245 226 h14" stroke="#94a3b8" stroke-width="3"/>
  </g>
  <g>
    <rect x="346" y="84" width="172" height="70" rx="14" fill="#111827" stroke="#475569"/>
    <text x="432" y="111" text-anchor="middle" class="small">SIDE ROOMS</text>
    <rect x="386" y="124" width="92" height="18" rx="9" fill="#334155"/>
    <rect x="386" y="124" width="48" height="18" rx="9" fill="#ef4444" opacity=".85"/>
  </g>

  <text x="600" y="662" text-anchor="middle" class="micro">symbolic editorial art • not a screenshot • public-safe synthesis from inspectable repository evidence</text>
</svg>
