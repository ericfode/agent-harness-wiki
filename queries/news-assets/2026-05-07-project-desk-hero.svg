<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Nightly source projects desk, 2026-05-07</title>
  <desc id="desc">Symbolic editorial illustration of a public-safety-filtered source tree survey: spec-code prisms, test benches, model research tiles, a terminal, game cards, face music, and privacy shields.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0c1b2e"/>
      <stop offset="1" stop-color="#121622"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17283a"/>
      <stop offset="1" stop-color="#263146"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .line{fill:none;stroke:#5fb9d6;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:.82}
      .thin{fill:none;stroke:#91a8bd;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
      .gold{fill:#d5a84b}.cyan{fill:#6cd4e4}.ink{fill:#0a1321}.panel{fill:#132338;stroke:#34506b;stroke-width:2}.muted{fill:#8ea2b5}.safe{fill:#1f3545;stroke:#6cd4e4;stroke-width:3}.paper{fill:#e8dcc2}.shadow{fill:#050914;opacity:.38}.label{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:18px;fill:#b9c7d5;letter-spacing:.08em}.tiny{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#7f95a8;letter-spacing:.05em}
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="185" cy="90" r="120" fill="#143044" opacity=".28"/>
  <circle cx="1020" cy="120" r="150" fill="#2b2142" opacity=".24"/>
  <circle cx="930" cy="550" r="190" fill="#102d34" opacity=".24"/>

  <path d="M85 505 C270 438 445 430 600 465 C785 507 944 472 1118 413" class="thin" opacity=".33"/>
  <path d="M75 545 C265 497 430 505 606 530 C785 556 965 532 1130 470" class="thin" opacity=".22"/>
  <rect x="82" y="430" width="1036" height="144" rx="20" fill="url(#desk)" stroke="#35465d" stroke-width="2"/>
  <ellipse cx="600" cy="580" rx="470" ry="48" class="shadow"/>

  <!-- Spec-code reducer prism -->
  <g transform="translate(120 168)">
    <rect x="0" y="74" width="145" height="162" rx="10" class="paper" opacity=".95"/>
    <path d="M19 105h94M19 130h72M19 156h99M19 181h62M19 206h80" stroke="#738091" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    <polygon points="185,55 282,111 282,224 185,280 88,224 88,111" fill="#172d43" stroke="#6cd4e4" stroke-width="3" filter="url(#glow)"/>
    <path d="M185 55v225M88 111l194 113M282 111L88 224" class="line" opacity=".7"/>
    <circle cx="185" cy="168" r="25" class="gold"/>
    <path d="M305 108h82M305 144h63M305 180h96M305 216h54" class="line"/>
    <rect x="326" y="70" width="92" height="34" rx="8" class="panel"/>
    <text x="342" y="93" class="tiny">BASIS</text>
  </g>

  <!-- Test RL bench -->
  <g transform="translate(470 120)">
    <rect x="0" y="0" width="230" height="178" rx="18" class="panel"/>
    <path d="M36 52l25 26 52-59" fill="none" stroke="#80d16c" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="137" y="39" width="54" height="64" rx="7" fill="#1b2535" stroke="#d5a84b" stroke-width="3"/>
    <path d="M150 70h28M150 86h18" stroke="#d5a84b" stroke-width="4" stroke-linecap="round"/>
    <path d="M35 132h160" class="thin"/>
    <circle cx="54" cy="132" r="9" class="cyan"/>
    <circle cx="116" cy="132" r="9" class="gold"/>
    <circle cx="178" cy="132" r="9" fill="#80d16c"/>
    <text x="27" y="204" class="label">TEST BENCH</text>
  </g>

  <!-- Tinygrad/Gemma lab -->
  <g transform="translate(760 118)">
    <rect x="0" y="0" width="250" height="195" rx="18" class="panel"/>
    <rect x="58" y="42" width="128" height="104" rx="13" fill="#0a1321" stroke="#6cd4e4" stroke-width="3"/>
    <path d="M78 62h88M78 84h88M78 106h88M78 128h88M98 50v108M122 50v108M146 50v108" stroke="#3f6f88" stroke-width="2"/>
    <circle cx="77" cy="62" r="5" class="gold"/><circle cx="146" cy="84" r="5" class="cyan"/><circle cx="122" cy="128" r="5" fill="#80d16c"/>
    <path d="M32 79h26M186 79h30M32 112h26M186 112h30M94 27V8M122 27V8M150 27V8M94 180v-34M122 180v-34M150 180v-34" class="line"/>
    <text x="34" y="222" class="label">MODEL LAB</text>
  </g>

  <!-- Craft row: terminal, cards, face music -->
  <g transform="translate(165 395)">
    <rect x="0" y="0" width="165" height="100" rx="12" fill="#08121f" stroke="#6cd4e4" stroke-width="3"/>
    <path d="M24 32l24 19-24 19M65 72h58" stroke="#6cd4e4" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="18" y="126" class="tiny">RUST TERMINAL</text>
  </g>

  <g transform="translate(433 382)">
    <rect x="0" y="22" width="78" height="116" rx="10" fill="#233652" stroke="#d5a84b" stroke-width="3" transform="rotate(-8 39 80)"/>
    <rect x="55" y="8" width="78" height="116" rx="10" fill="#1a2e45" stroke="#d5a84b" stroke-width="3" transform="rotate(6 94 66)"/>
    <path d="M32 65h41M26 92h46M88 52h38M83 80h43" stroke="#d5a84b" stroke-width="4" stroke-linecap="round"/>
    <text x="-5" y="166" class="tiny">DUNGEON STEWARD</text>
  </g>

  <g transform="translate(690 371)">
    <circle cx="64" cy="67" r="50" fill="#172d43" stroke="#6cd4e4" stroke-width="3"/>
    <path d="M44 62c11-12 28-12 40 0M45 82c14 15 34 15 48 0" class="thin"/>
    <circle cx="47" cy="54" r="5" class="cyan"/><circle cx="84" cy="54" r="5" class="cyan"/>
    <path d="M139 42v64c0 13-11 23-25 23s-25-8-25-19 10-18 23-18c6 0 12 1 17 4V34h10z" class="gold"/>
    <text x="0" y="156" class="tiny">FACE MUSIC</text>
  </g>

  <!-- Safety shields and closed drawers -->
  <g transform="translate(930 358)">
    <path d="M86 12l62 24v54c0 48-33 82-62 95-29-13-62-47-62-95V36z" class="safe"/>
    <path d="M57 92l22 22 43-55" fill="none" stroke="#d5a84b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-12" y="142" width="200" height="54" rx="10" fill="#1a2434" stroke="#34506b" stroke-width="2"/>
    <path d="M26 169h124" stroke="#50657a" stroke-width="4" stroke-linecap="round"/>
    <text x="12" y="224" class="tiny">SAFETY FILTER</text>
  </g>

  <!-- connective evidence trails -->
  <path d="M390 292C448 310 464 342 520 388" class="line" opacity=".45"/>
  <path d="M600 300C604 340 602 365 598 418" class="line" opacity=".33"/>
  <path d="M870 316C820 346 792 361 764 404" class="line" opacity=".42"/>
  <path d="M1002 328C1025 356 1034 374 1037 414" class="line" opacity=".35"/>

  <text x="82" y="70" class="label">NIGHTLY SRC PROJECTS DESK · 2026-05-07</text>
  <text x="82" y="100" class="tiny">editorial illustration · inspectable evidence only · no screenshots</text>
</svg>
