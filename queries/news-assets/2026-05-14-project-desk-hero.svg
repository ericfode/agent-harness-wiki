<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Nightly source-projects desk, 2026-05-14</title>
  <desc id="desc">Symbolic editorial art: ten survey lanes pass through a public-safety filter into four publishable clusters for roguelike world-model probes, Gemma/tinygrad runtime work, verifier-test generation, and textual world-model research. Locked drawers represent held-back private material.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09111f"/>
      <stop offset="0.55" stop-color="#0e1729"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#eab308" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f8fafc" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label { font: 600 18px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #e5e7eb; letter-spacing: .02em; }
      .small { font: 500 13px ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #9ca3af; }
      .micro { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d1d5db; }
      .gold { stroke: #d6a93b; }
      .cyan { stroke: #22d3ee; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 2; rx: 18; }
    </style>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g opacity="0.18">
    <circle cx="1010" cy="105" r="150" fill="#38bdf8"/>
    <circle cx="260" cy="590" r="210" fill="#f59e0b"/>
  </g>

  <text x="70" y="62" class="label" font-size="24">Nightly source-projects desk</text>
  <text x="70" y="88" class="small">ten lanes • evidence only • public-safety filter</text>

  <!-- left desk and survey lanes -->
  <g transform="translate(70 132)">
    <rect x="0" y="254" width="385" height="92" rx="16" fill="#3b2718" stroke="#9a6a31" stroke-width="3"/>
    <rect x="28" y="346" width="92" height="140" rx="10" fill="#21150e" stroke="#7c5429"/>
    <rect x="262" y="346" width="92" height="140" rx="10" fill="#21150e" stroke="#7c5429"/>
    <rect x="92" y="292" width="190" height="112" rx="10" fill="#170f0a" opacity="0.92"/>
    <g class="gold" stroke-width="3" fill="none" opacity="0.9">
      <path d="M23 154 C75 210, 56 230, 96 254"/>
      <path d="M60 142 C105 205, 104 224, 132 254"/>
      <path d="M98 132 C132 202, 148 222, 166 254"/>
      <path d="M136 126 C164 200, 188 222, 200 254"/>
      <path d="M174 126 C194 201, 226 224, 234 254"/>
      <path d="M212 132 C225 206, 260 226, 268 254"/>
      <path d="M250 142 C254 210, 294 230, 302 254"/>
      <path d="M288 154 C286 213, 330 232, 336 254"/>
      <path d="M326 166 C320 218, 350 237, 360 254"/>
      <path d="M364 178 C350 222, 368 240, 382 254"/>
    </g>
    <g transform="translate(8 0)">
      <rect x="0" y="0" width="365" height="132" rx="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <text x="22" y="32" class="label">10 survey lanes</text>
      <text x="22" y="56" class="small">docs • git • mtimes • safety</text>
      <g transform="translate(22 78)">
        <rect width="310" height="26" rx="13" fill="#020617" stroke="#334155"/>
        <g stroke="url(#lane)" stroke-width="4" stroke-linecap="round">
          <line x1="18" y1="13" x2="292" y2="13"/>
          <line x1="18" y1="7" x2="292" y2="7" opacity="0.55"/>
          <line x1="18" y1="19" x2="292" y2="19" opacity="0.55"/>
        </g>
      </g>
    </g>
  </g>

  <!-- safety gate -->
  <g transform="translate(493 170)" filter="url(#softGlow)">
    <path d="M0 0 L114 42 L114 277 L0 319 Z" fill="#142033" stroke="#eab308" stroke-width="3"/>
    <path d="M28 46 L86 68 L86 246 L28 270 Z" fill="#020617" stroke="#64748b" stroke-width="2"/>
    <g stroke="#eab308" stroke-width="3" opacity="0.85">
      <line x1="40" y1="66" x2="40" y2="252"/>
      <line x1="58" y1="72" x2="58" y2="244"/>
      <line x1="76" y1="78" x2="76" y2="236"/>
    </g>
    <text x="-18" y="350" class="small">public-safety filter</text>
  </g>

  <!-- held back drawers -->
  <g transform="translate(86 546)">
    <rect x="0" y="0" width="260" height="55" rx="12" fill="#111827" stroke="#7c5429"/>
    <text x="18" y="23" class="micro">held back: private configs, raw logs, corpora, checkpoints</text>
    <g fill="none" stroke="#d6a93b" stroke-width="2">
      <path d="M220 18 h18 v18 h-18 z"/>
      <path d="M225 18 v-6 a4 4 0 0 1 8 0 v6"/>
    </g>
  </g>

  <!-- publishable clusters -->
  <g transform="translate(665 82)">
    <rect class="panel" x="0" y="0" width="220" height="180"/>
    <text x="20" y="34" class="label">roguelike probes</text>
    <text x="20" y="56" class="small">symbolic state first</text>
    <g transform="translate(35 76)" stroke="#334155" stroke-width="2">
      <rect x="0" y="0" width="126" height="72" fill="#0b1220"/>
      <path d="M0 24h126M0 48h126M42 0v72M84 0v72"/>
      <circle cx="63" cy="36" r="13" fill="#22d3ee" opacity="0.85" filter="url(#softGlow)"/>
      <path d="M63 23 l8 13 l-8 13 l-8-13 z" fill="#f59e0b"/>
    </g>
  </g>

  <g transform="translate(930 82)">
    <rect class="panel" x="0" y="0" width="220" height="180"/>
    <text x="20" y="34" class="label">Gemma/tinygrad</text>
    <text x="20" y="56" class="small">runtime benches</text>
    <g transform="translate(51 76)">
      <rect x="0" y="0" width="118" height="78" rx="12" fill="#0f766e" stroke="#67e8f9" stroke-width="3"/>
      <rect x="32" y="20" width="54" height="36" rx="6" fill="#082f49" stroke="#a7f3d0"/>
      <g stroke="#d6a93b" stroke-width="3">
        <line x1="-14" y1="12" x2="0" y2="12"/><line x1="-14" y1="30" x2="0" y2="30"/><line x1="-14" y1="48" x2="0" y2="48"/><line x1="-14" y1="66" x2="0" y2="66"/>
        <line x1="118" y1="12" x2="132" y2="12"/><line x1="118" y1="30" x2="132" y2="30"/><line x1="118" y1="48" x2="132" y2="48"/><line x1="118" y1="66" x2="132" y2="66"/>
      </g>
    </g>
  </g>

  <g transform="translate(665 328)">
    <rect class="panel" x="0" y="0" width="220" height="180"/>
    <text x="20" y="34" class="label">verifier bench</text>
    <text x="20" y="56" class="small">test generation</text>
    <g transform="translate(38 78)">
      <rect x="0" y="0" width="86" height="76" rx="9" fill="#1f2937" stroke="#94a3b8"/>
      <path d="M18 27 l13 13 l28-32" fill="none" stroke="#22c55e" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M116 10 h44 v56 h-44 z" fill="#111827" stroke="#d6a93b" stroke-width="2"/>
      <path d="M126 10 v-8 a12 12 0 0 1 24 0 v8" fill="none" stroke="#d6a93b" stroke-width="3"/>
    </g>
  </g>

  <g transform="translate(930 328)">
    <rect class="panel" x="0" y="0" width="220" height="180"/>
    <text x="20" y="34" class="label">textual world model</text>
    <text x="20" y="56" class="small">repository timelines</text>
    <g transform="translate(28 83)" fill="none" stroke-linecap="round">
      <path d="M0 52 C36 14, 76 86, 112 38 S160 20, 170 58" stroke="#22d3ee" stroke-width="4"/>
      <path d="M0 76 C28 42, 56 40, 85 68 S132 92, 170 34" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
      <g stroke="#94a3b8" stroke-width="2" opacity="0.65">
        <line x1="14" y1="0" x2="14" y2="100"/><line x1="56" y1="0" x2="56" y2="100"/><line x1="98" y1="0" x2="98" y2="100"/><line x1="140" y1="0" x2="140" y2="100"/>
      </g>
    </g>
  </g>

  <g stroke="#d6a93b" stroke-width="3" fill="none" opacity="0.7">
    <path d="M607 248 C635 190, 645 174, 665 172"/>
    <path d="M607 248 C745 190, 880 172, 930 172"/>
    <path d="M607 310 C640 390, 645 418, 665 418"/>
    <path d="M607 310 C760 390, 885 418, 930 418"/>
  </g>

  <text x="70" y="641" class="small">Symbolic editorial SVG: no screenshots, no raw repo contents, no secret-bearing details.</text>
</svg>
