      <stop offset="0" stop-color="#071225"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202638"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1400" height="788" fill="url(#bg)"/>
