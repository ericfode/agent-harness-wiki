<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nightly src projects desk editorial illustration</title>
  <desc id="desc">Stylized editorial desk with symbolic stations for testing-RL, face music, Codex orchestration, tinygrad transformers, a deckbuilder, and NNPL boundary research.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#111b2e"/>
      <stop offset="1" stop-color="#1c1830"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62452e"/>
      <stop offset="0.5" stop-color="#8a6039"/>
      <stop offset="1" stop-color="#4f3828"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .label{font:700 28px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#dbeafe;letter-spacing:.04em}
      .small{font:600 18px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9fb7d7;letter-spacing:.02em}
      .line{stroke:#86efac;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#93c5fd;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .gold{stroke:#fbbf24;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .card{fill:#f8fafc;stroke:#0f172a;stroke-width:5;rx:16}
      .panel{fill:#101b2d;stroke:#334155;stroke-width:4;rx:22}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="270" cy="155" r="95" fill="#f59e0b" opacity=".16" filter="url(#glow)"/>
  <circle cx="1330" cy="170" r="115" fill="#38bdf8" opacity=".12" filter="url(#glow)"/>
  <path d="M0 708 C260 650 420 754 650 704 C900 650 1010 762 1600 690 L1600 900 L0 900 Z" fill="url(#desk)"/>
  <path d="M0 708 C260 650 420 754 650 704 C900 650 1010 762 1600 690" stroke="#c08457" stroke-width="8" fill="none" opacity=".75"/>

  <!-- Testing RL / formal lab -->
  <g transform="translate(92 210)">
    <rect class="panel" width="325" height="255"/>
    <text x="28" y="48" class="label">testing-rl</text>
    <path class="thin" d="M35 82 H288"/>
    <rect x="35" y="108" width="92" height="52" rx="10" fill="#172554" stroke="#60a5fa" stroke-width="3"/>
    <rect x="151" y="108" width="92" height="52" rx="10" fill="#052e16" stroke="#86efac" stroke-width="3"/>
    <path class="gold" d="M128 134 H149"/>
    <text x="54" y="142" class="small">bug</text>
    <text x="168" y="142" class="small">test</text>
    <path class="line" d="M60 196 l30 30 l76 -86"/>
    <path class="thin" d="M202 196 q36 -34 72 0 q-36 34 -72 0Z"/>
    <circle cx="238" cy="196" r="8" fill="#93c5fd"/>
  </g>

  <!-- Face music -->
  <g transform="translate(466 148)">
    <rect class="panel" width="310" height="290"/>
    <text x="34" y="50" class="label">FACEMUSIC</text>
    <path d="M155 88 C88 88 70 164 92 215 C113 266 197 266 219 215 C240 164 222 88 155 88Z" fill="#1e293b" stroke="#f0abfc" stroke-width="5"/>
    <circle cx="128" cy="166" r="8" fill="#f0abfc"/>
    <circle cx="182" cy="166" r="8" fill="#f0abfc"/>
    <path d="M128 215 C148 232 171 232 190 215" stroke="#f0abfc" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path class="gold" d="M36 255 C80 214 111 282 155 240 S230 214 274 255"/>
    <path class="thin" d="M37 236 C81 195 112 263 156 221 S231 195 275 236" opacity=".72"/>
  </g>

  <!-- Codex ledger -->
  <g transform="translate(830 185)">
    <rect class="panel" width="310" height="250"/>
    <text x="32" y="50" class="label">codex ledger</text>
    <circle cx="76" cy="118" r="26" fill="#0f172a" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="178" cy="118" r="26" fill="#0f172a" stroke="#86efac" stroke-width="4"/>
    <circle cx="229" cy="190" r="26" fill="#0f172a" stroke="#93c5fd" stroke-width="4"/>
    <circle cx="108" cy="196" r="26" fill="#0f172a" stroke="#f0abfc" stroke-width="4"/>
    <path class="thin" d="M102 118 H152 M189 141 L218 170 M159 134 L122 174"/>
    <path class="gold" d="M44 78 H267 M44 226 H267" opacity=".8"/>
  </g>

  <!-- tinygrad transformer bench -->
  <g transform="translate(1195 220)">
    <rect class="panel" width="300" height="245"/>
    <text x="31" y="48" class="label">tinygrad</text>
    <g transform="translate(38 82)">
      <rect x="0" y="0" width="62" height="54" rx="9" fill="#1e1b4b" stroke="#a78bfa" stroke-width="4"/>
      <rect x="82" y="0" width="62" height="54" rx="9" fill="#1e1b4b" stroke="#a78bfa" stroke-width="4"/>
      <rect x="164" y="0" width="62" height="54" rx="9" fill="#1e1b4b" stroke="#a78bfa" stroke-width="4"/>
      <rect x="41" y="82" width="62" height="54" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
      <rect x="123" y="82" width="62" height="54" rx="9" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
      <path class="thin" d="M31 54 L72 82 M113 54 L72 82 M113 54 L154 82 M195 54 L154 82"/>
      <path class="line" d="M12 166 H214"/>
    </g>
  </g>

  <!-- Deckbuilder cards -->
  <g transform="translate(296 585) rotate(-7)">
    <rect class="card" width="112" height="158"/>
    <text x="24" y="48" font-family="ui-monospace,monospace" font-size="24" font-weight="700" fill="#0f172a">run</text>
    <path d="M28 93 h56 M28 116 h56" stroke="#0f172a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(390 568) rotate(6)">
    <rect class="card" width="112" height="158"/>
    <text x="23" y="48" font-family="ui-monospace,monospace" font-size="24" font-weight="700" fill="#0f172a">deck</text>
    <path d="M56 75 l30 52 h-60z" fill="#fbbf24" stroke="#0f172a" stroke-width="5"/>
  </g>
  <text x="292" y="804" class="small">Dungeon Steward</text>

  <!-- NNPL boundary diagram -->
  <g transform="translate(720 570)">
    <rect x="0" y="0" width="385" height="170" rx="24" fill="#0b1324" stroke="#475569" stroke-width="4"/>
    <text x="28" y="45" class="label">NNPL boundary</text>
    <rect x="35" y="82" width="86" height="48" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="4"/>
    <rect x="150" y="72" width="86" height="68" rx="12" fill="#0f172a" stroke="#86efac" stroke-width="4"/>
    <rect x="265" y="82" width="86" height="48" rx="12" fill="#312e81" stroke="#c4b5fd" stroke-width="4"/>
    <path class="gold" d="M121 106 H150 M236 106 H265"/>
    <text x="56" y="113" class="small">IR</text>
    <text x="167" y="113" class="small">bus</text>
    <text x="285" y="113" class="small">out</text>
  </g>

  <!-- Newspaper headline strips -->
  <g transform="translate(92 62)">
    <rect x="0" y="0" width="640" height="64" rx="14" fill="#f8fafc" opacity=".92"/>
    <text x="28" y="43" font-family="Georgia,serif" font-size="34" font-weight="700" fill="#111827">Nightly Src Projects Desk</text>
  </g>
  <g transform="translate(912 70)">
    <rect x="0" y="0" width="492" height="46" rx="12" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <text x="24" y="31" class="small">tests • instruments • ledgers • boundaries</text>
  </g>
</svg>
