<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Symbolic nightly source-project desk illustration</title>
  <desc id="desc">Ten survey lanes pass through a public-safety filter into five project clusters.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#17213f"/>
      <stop offset="62%" stop-color="#0d1228"/>
      <stop offset="100%" stop-color="#070916"/>
    </radialGradient>
    <linearGradient id="laneA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee7d6" stop-opacity="0.25"/>
      <stop offset="0.55" stop-color="#7ee7d6"/>
      <stop offset="1" stop-color="#f2c14e"/>
    </linearGradient>
    <linearGradient id="laneB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a74ff" stop-opacity="0.25"/>
      <stop offset="0.6" stop-color="#5a74ff"/>
      <stop offset="1" stop-color="#7ee7d6"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .thin{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .gold{stroke:#f2c14e}.teal{stroke:#7ee7d6}.blue{stroke:#5a74ff}.ink{stroke:#c9d3ff}
      .node{fill:#111a36;stroke:#c9d3ff;stroke-width:2;opacity:.96}
      .panel{fill:#0c1631;stroke:#7ee7d6;stroke-width:2.2;opacity:.92}
      .small{fill:#101936;stroke:#f2c14e;stroke-width:1.7;opacity:.95}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.25" class="thin ink" stroke-width="1">
    <path d="M120 130 C330 90 500 120 700 90"/>
    <path d="M920 790 C1100 730 1280 760 1490 690"/>
    <path d="M90 760 C220 710 310 790 430 740"/>
  </g>
  <g id="filter" filter="url(#softGlow)">
    <rect x="150" y="330" width="190" height="180" rx="28" class="panel"/>
    <path d="M174 376 h142 M174 418 h142 M174 460 h142" class="thin teal" stroke-width="5" opacity=".85"/>
    <circle cx="215" cy="330" r="18" fill="#0d1228" stroke="#7ee7d6" stroke-width="3"/>
    <circle cx="275" cy="510" r="18" fill="#0d1228" stroke="#f2c14e" stroke-width="3"/>
    <path d="M245 300 l32 30 -32 30 -32-30z" fill="#101936" stroke="#c9d3ff" stroke-width="2"/>
  </g>
  <g id="hub" filter="url(#softGlow)">
    <polygon points="800,310 910,370 910,500 800,565 690,500 690,370" fill="#101936" stroke="#c9d3ff" stroke-width="2.5"/>
    <polygon points="800,350 872,391 872,475 800,518 728,475 728,391" fill="#0c1631" stroke="#7ee7d6" stroke-width="2"/>
    <circle cx="800" cy="433" r="42" fill="none" stroke="#f2c14e" stroke-width="4"/>
    <circle cx="800" cy="433" r="14" fill="#f2c14e" opacity=".75"/>
  </g>
  <g id="lanes" class="thin" stroke-width="4" opacity=".92">
    <path d="M340 350 C470 335 585 352 690 380" stroke="url(#laneA)"/>
    <path d="M340 366 C485 360 590 381 690 405" stroke="url(#laneB)"/>
    <path d="M340 382 C500 390 595 412 690 430" stroke="url(#laneA)"/>
    <path d="M340 398 C505 420 602 445 690 455" stroke="url(#laneB)"/>
    <path d="M340 414 C500 450 600 475 690 480" stroke="url(#laneA)"/>
    <path d="M340 430 C510 486 610 503 690 505" stroke="url(#laneB)"/>
    <path d="M910 382 C1030 320 1135 260 1265 210" stroke="url(#laneA)"/>
    <path d="M910 418 C1040 408 1170 386 1305 340" stroke="url(#laneB)"/>
    <path d="M910 462 C1035 512 1168 555 1305 618" stroke="url(#laneA)"/>
    <path d="M910 500 C1020 602 1118 686 1260 735" stroke="url(#laneB)"/>
  </g>
  <g id="clusters" filter="url(#softGlow)">
    <g transform="translate(1220 130)">
      <rect x="0" y="0" width="115" height="82" rx="12" class="node"/>
      <rect x="145" y="30" width="75" height="56" rx="10" class="small"/>
      <circle cx="56" cy="41" r="22" fill="none" stroke="#7ee7d6" stroke-width="4"/>
      <path d="M40 41 h32 M56 25 v32" class="thin teal" stroke-width="3"/>
    </g>
    <g transform="translate(1280 300)">
      <polygon points="40,0 105,38 105,112 40,150 -25,112 -25,38" class="node"/>
      <path d="M40 0 v150 M-25 38 l130 74 M105 38 l-130 74" class="thin gold" stroke-width="2.5" opacity=".8"/>
      <circle cx="150" cy="95" r="34" fill="none" stroke="#7ee7d6" stroke-width="3"/>
    </g>
    <g transform="translate(1225 575)">
      <rect x="0" y="0" width="95" height="120" rx="14" class="node"/>
      <path d="M25 35 h45 M25 60 h45 M25 85 h28" class="thin ink" stroke-width="3" opacity=".8"/>
      <circle cx="145" cy="60" r="48" fill="#101936" stroke="#f2c14e" stroke-width="3"/>
      <path d="M118 60 q27-38 54 0 q-27 38-54 0z" fill="none" stroke="#f2c14e" stroke-width="3"/>
    </g>
    <g transform="translate(610 655)">
      <rect x="0" y="0" width="110" height="72" rx="14" class="small"/>
      <rect x="145" y="-35" width="100" height="100" rx="16" class="node"/>
      <circle cx="195" cy="15" r="27" fill="none" stroke="#7ee7d6" stroke-width="3"/>
      <path d="M28 24 h55 M28 48 h40" class="thin gold" stroke-width="3"/>
    </g>
    <g transform="translate(210 610)">
      <rect x="0" y="0" width="110" height="78" rx="14" class="node"/>
      <rect x="145" y="-52" width="90" height="90" rx="18" class="small"/>
      <path d="M25 25 c32-36 56 36 88 0" class="thin teal" stroke-width="4"/>
      <path d="M165-15 h50 M165 10 h50 M165 35 h30" class="thin gold" stroke-width="3"/>
    </g>
  </g>
  <g opacity=".8">
    <circle cx="452" cy="228" r="3" fill="#7ee7d6"/><circle cx="500" cy="246" r="2.5" fill="#f2c14e"/>
    <circle cx="1112" cy="177" r="3" fill="#f2c14e"/><circle cx="1165" cy="690" r="2.5" fill="#7ee7d6"/>
    <circle cx="362" cy="712" r="2.5" fill="#c9d3ff"/><circle cx="1010" cy="604" r="3" fill="#5a74ff"/>
  </g>
</svg>
