<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Sub-vault structure">
  <defs>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #111827; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .num { font: 800 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; }
      .card-title { font: 700 33px Georgia, serif; fill: #111827; }
      .card-subtitle { font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .card-body { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 600 13px "SFMono-Regular", ui-monospace, Menlo, monospace; fill: #475569; }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
<rect width="1200" height="640" fill="url(#paper)"/>
<text x="58" y="72" class="title">Sub-vault structure</text>
<text x="60" y="102" class="subtitle">Evidence stays separate from synthesis; the ontology earns its keep.</text>
<rect x="75" y="190" width="180" height="180" rx="28" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<rect x="99" y="218" width="132" height="46" rx="23" fill="#2563eb" opacity="0.85"/>
<text x="165" y="248" text-anchor="middle" class="num">1</text>
<text x="95" y="305" class="label">Raw articles / dockets</text>
<text x="95" y="334" class="small">captured evidence</text>
<path d="M259,280 H290" stroke="#64748b" stroke-width="4"/>
<rect x="295" y="190" width="180" height="180" rx="28" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<rect x="319" y="218" width="132" height="46" rx="23" fill="#0f766e" opacity="0.85"/>
<text x="385" y="248" text-anchor="middle" class="num">2</text>
<text x="315" y="305" class="label">Entities</text>
<text x="315" y="334" class="small">site dossiers</text>
<path d="M479,280 H510" stroke="#64748b" stroke-width="4"/>
<rect x="515" y="190" width="180" height="180" rx="28" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<rect x="539" y="218" width="132" height="46" rx="23" fill="#7c3aed" opacity="0.85"/>
<text x="605" y="248" text-anchor="middle" class="num">3</text>
<text x="535" y="305" class="label">Concepts</text>
<text x="535" y="334" class="small">rules and methods</text>
<path d="M699,280 H730" stroke="#64748b" stroke-width="4"/>
<rect x="735" y="190" width="180" height="180" rx="28" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<rect x="759" y="218" width="132" height="46" rx="23" fill="#d97706" opacity="0.85"/>
<text x="825" y="248" text-anchor="middle" class="num">4</text>
<text x="755" y="305" class="label">Comparisons</text>
<text x="755" y="334" class="small">ranked screens</text>
<path d="M919,280 H950" stroke="#64748b" stroke-width="4"/>
<rect x="955" y="190" width="180" height="180" rx="28" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<rect x="979" y="218" width="132" height="46" rx="23" fill="#c2410c" opacity="0.85"/>
<text x="1045" y="248" text-anchor="middle" class="num">5</text>
<text x="975" y="305" class="label">Queries</text>
<text x="975" y="334" class="small">monitor instructions</text>
<text x="72" y="535" class="small">Visual convention added 2026-05-14: rendered pages include at least one non-evidentiary image block.</text>
</svg>
