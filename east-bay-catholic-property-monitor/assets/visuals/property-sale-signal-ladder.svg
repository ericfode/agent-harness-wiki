<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Property sale signal ladder">
  <defs>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #111827; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .num { font: 800 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; }
      .card-title { font: 700 33px Georgia, serif; fill: #111827; }
      .card-subtitle { font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .card-body { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 600 13px "SFMono-Regular", ui-monospace, Menlo, monospace; fill: #475569; }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
<rect width="1200" height="680" fill="url(#paper)"/>
<text x="58" y="72" class="title">Property-sale signal ladder</text>
<text x="60" y="102" class="subtitle">A visual reminder: closure is not sale; sale evidence has levels.</text>
<circle cx="85" cy="160" r="28" fill="#64748b"/>
<text x="85" y="166" text-anchor="middle" class="num">1</text>
<rect x="140" y="127" width="890" height="66" rx="20" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<text x="168" y="153" class="label">Closure / MAP mention</text>
<text x="168" y="178" class="small">Watch item only</text>
<path d="M85,192 V218" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
<circle cx="85" cy="252" r="28" fill="#d97706"/>
<text x="85" y="258" text-anchor="middle" class="num">2</text>
<rect x="140" y="219" width="890" height="66" rx="20" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<text x="168" y="245" class="label">Court docket names parcel</text>
<text x="168" y="270" class="small">Disposition/collateralization signal</text>
<path d="M85,284 V310" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
<circle cx="85" cy="344" r="28" fill="#c2410c"/>
<text x="85" y="350" text-anchor="middle" class="num">3</text>
<rect x="140" y="311" width="890" height="66" rx="20" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<text x="168" y="337" class="label">Broker listing / asking price</text>
<text x="168" y="362" class="small">Market signal</text>
<path d="M85,376 V402" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
<circle cx="85" cy="436" r="28" fill="#7c2d12"/>
<text x="85" y="442" text-anchor="middle" class="num">4</text>
<rect x="140" y="403" width="890" height="66" rx="20" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<text x="168" y="429" class="label">Sale motion / confirmed buyer</text>
<text x="168" y="454" class="small">Transaction signal</text>
<path d="M85,468 V494" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
<circle cx="85" cy="528" r="28" fill="#0f766e"/>
<text x="85" y="534" text-anchor="middle" class="num">5</text>
<rect x="140" y="495" width="890" height="66" rx="20" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<text x="168" y="521" class="label">Recorded sale price</text>
<text x="168" y="546" class="small">Observed price</text>
<text x="60" y="640" class="tiny">Current project posture: several Oakland closure sites have court-docket disposition/collateralization signals; none has an observed asking or sale price in the current dossiers.</text>
</svg>
