<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Valuation method flow">
  <defs>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #111827; }
      .subtitle { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .tiny { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .label { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .num { font: 800 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: white; }
      .card-title { font: 700 33px Georgia, serif; fill: #111827; }
      .card-subtitle { font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .card-body { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .mono { font: 600 13px "SFMono-Regular", ui-monospace, Menlo, monospace; fill: #475569; }
    </style>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#164e63"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
  </defs>
<rect width="1200" height="620" fill="#f8fafc"/>
<text x="58" y="72" class="title">Valuation method flow</text>
<text x="60" y="102" class="subtitle">The estimate is a maintenance screen until real market evidence arrives.</text>
<rect x="72" y="190" width="180" height="185" rx="24" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<circle cx="162" cy="242" r="28" fill="#0f766e"/>
<text x="162" y="248" text-anchor="middle" class="num">1</text>
<text x="90" y="294" class="label">Parcel envelope</text>
<text x="90" y="324" class="tiny">APNs, lot area, owner, use</text>
<text x="90" y="343" class="tiny">code</text>
<path d="M260,282 H287" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="290" y="190" width="180" height="185" rx="24" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<circle cx="380" cy="242" r="28" fill="#0f766e"/>
<text x="380" y="248" text-anchor="middle" class="num">2</text>
<text x="308" y="294" class="label">Assessed values</text>
<text x="308" y="324" class="tiny">Land + improvements from</text>
<text x="308" y="343" class="tiny">parcel data</text>
<path d="M478,282 H505" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="508" y="190" width="180" height="185" rx="24" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<circle cx="598" cy="242" r="28" fill="#0f766e"/>
<text x="598" y="248" text-anchor="middle" class="num">3</text>
<text x="526" y="294" class="label">Same-ZIP land screen</text>
<text x="526" y="324" class="tiny">Median land value / sq ft</text>
<text x="526" y="343" class="tiny">sample</text>
<path d="M696,282 H723" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="726" y="190" width="180" height="185" rx="24" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<circle cx="816" cy="242" r="28" fill="#0f766e"/>
<text x="816" y="248" text-anchor="middle" class="num">4</text>
<text x="744" y="294" class="label">Core range</text>
<text x="744" y="324" class="tiny">Low-confidence acquisition</text>
<text x="744" y="343" class="tiny">screen</text>
<path d="M914,282 H941" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="944" y="190" width="180" height="185" rx="24" fill="white" stroke="#cbd5e1" filter="url(#shadow)"/>
<circle cx="1034" cy="242" r="28" fill="#0f766e"/>
<text x="1034" y="248" text-anchor="middle" class="num">5</text>
<text x="962" y="294" class="label">Observed price override</text>
<text x="962" y="324" class="tiny">Asking / court value / sale</text>
<text x="962" y="343" class="tiny">price wins</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L6,3 z" fill="#94a3b8"/></marker></defs>
<text x="72" y="535" class="small">Rule: never promote an agent estimate to a listing price. The first grounded price source displaces the screen.</text>
</svg>
